---
name: Metric Quality Gate

on:
  workflow_call:
    inputs:
      lintStatus:
        required: false
        type: string
        description: "string representing status of quality gate, 'success' for passing, anything other string for not passing gate"
        default: "notchecked"
      secretScanStatus:
        required: false
        type: string
        description: "string representing status of quality gate, 'success' for passing, anything other string for not passing gate"
        default: "notchecked"
      spellcheckStatus:
        required: false
        type: string
        description: "string representing status of quality gate, 'success' for passing, anything other string for not passing gate"
        default: "notchecked"
      dependencyStatus:
        required: false
        type: string
        description: "string representing status of quality gate, 'success' for passing, anything other string for not passing gate"
        default: "notchecked"
      sourceId:
        required: true
        type: string
        description: "The sourceId of the metric in atlassian compass"
    outputs:
      changed_files:
        description: "the percentage of code quality"
        value: ${{ jobs.report-code-quality-metric.outputs.changed_files }}

permissions: read-all

env:
  STEP_VALUE: 25

jobs:
  report-code-quality-metric:
    name: Report Code Quality Metric
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.dependency_status.outputs.metric_value }}
    steps:
      - name: Check lint status
        env:
          LINT_STATUS: ${{ inputs.lintStatus }}
        run: |
          # shellcheck disable=SC2086
          {
            if [ "$LINT_STATUS" == "success" ]; then
              METRIC_VALUE=$STEP_VALUE
            elif [ "$LINT_STATUS" == "notchecked" ]; then
              METRIC_VALUE=$STEP_VALUE
            else
              METRIC_VALUE=0
            fi

            {
              echo 'metric_value<<EOF'
              echo $METRIC_VALUE
              echo EOF
            } >> $GITHUB_ENV
          }

      - name: Check secret scan status
        env:
          SECRET_SCAN_STATUS: ${{ inputs.secretScanStatus }}
        run: |
          # shellcheck disable=SC2086
          {
            if [ "$SECRET_SCAN_STATUS" == "success" ]; then
              METRIC_VALUE=$STEP_VALUE
            elif [ "$SECRET_SCAN_STATUS" == "notchecked" ]; then
              METRIC_VALUE=$STEP_VALUE
            else
              METRIC_VALUE=0
            fi

          METRIC_VALUE=$((METRIC_VALUE + $metric_value))

            {
              echo 'metric_value<<EOF'
              echo $METRIC_VALUE
              echo EOF
            } >> $GITHUB_ENV
          }

      - name: Check spellcheck status
        env:
          SPELLCHECK_STATUS: ${{ inputs.spellcheckStatus }}
        run: |
          # shellcheck disable=SC2086
          {
            if [ "$SPELLCHECK_STATUS" == "success" ]; then
              METRIC_VALUE=$STEP_VALUE
            elif [ "$SPELLCHECK_STATUS" == "notchecked" ]; then
              METRIC_VALUE=$STEP_VALUE
            else
              METRIC_VALUE=0
            fi

          METRIC_VALUE=$((METRIC_VALUE + $metric_value))

            {
              echo 'metric_value<<EOF'
              echo $METRIC_VALUE
              echo EOF
            } >> $GITHUB_ENV
          }

      - name: Check dependency status
        id: dependency_status
        env:
          DEPENDENCY_STATUS: ${{ inputs.dependencyStatus }}
        run: |
          # shellcheck disable=SC2086
          {
            if [ "$DEPENDENCY_STATUS" == "success" ]; then
              METRIC_VALUE=$STEP_VALUE
            elif [ "$DEPENDENCY_STATUS" == "notchecked" ]; then
              METRIC_VALUE=$STEP_VALUE
            else
              METRIC_VALUE=0
            fi

          METRIC_VALUE=$((METRIC_VALUE + $metric_value))

            {
              echo 'metric_value<<EOF'
              echo $METRIC_VALUE
              echo EOF
            } >> $GITHUB_ENV
          }

      - name: Report code Quality
        env:
          SOURCE_ID: ${{ inputs.sourceId }}
          ATLASSIAN_USER: ${{ secrets.ATLASSIAN_API_USEREMAIL }}
          ATLASSIAN_KEY: ${{ secrets.ATLASSIAN_API_KEY }}
        run: |
          # shellcheck disable=SC2086
          {
            curl --request POST \
              --url https://gigatech-net.atlassian.net/gateway/api/compass/v1/metrics \
              --user "$ATLASSIAN_USER:$ATLASSIAN_KEY" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "{
                \"metricSourceId\": \"$SOURCE_ID\",
                \"value\": $metric_value,
                \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
              }"
          }
