---
name: Dependency Check

on:
  workflow_call:
    inputs:
      artifactName:
        required: false
        type: string
        description: "The artifact name to write to GH blob storage after this workflow completes"
        default: "vulnerability_rpt"
      retentionDays:
        required: false
        type: number
        description: "The number of days to retain the artifact in GH blob storage after this workflow completes"
        default: 1

permissions: read-all

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-dependency-check.yaml workflow is deprecated."
          echo "🔄 Please use the appropriate composite action instead:"
          echo "   uses: GigaTech-net/public-reusable-workflows/.github/actions/dependency-check@v1"
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: deprecation-notice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        id: dependency-check
        with:
          project: ${{ github.repository }}
          path: "."
          format: "ALL"
          out: "reports"
          args: >
            --enableRetired
            --prettyPrint

      - name: Upload dependency check results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifactName }}-${{ github.sha }}
          path: ${{ github.workspace }}/reports
          retention-days: ${{ inputs.retentionDays }}
