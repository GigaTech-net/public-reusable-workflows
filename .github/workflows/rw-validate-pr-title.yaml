---
name: Validate PR title

on:
  workflow_call:
    inputs:
      ticket_key_regex:
        description: The regex to use to validate the ticket key in the PR title
        required: false
        type: string
        default: '([Pp][Rr][Oo]|[Hh][Oo][Tt][Ff][Ii][Xx])-\d{2,5}'

permissions:
  contents: read

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-validate-pr-title.yaml workflow is deprecated."
          echo "🔄 Please use the appropriate composite action instead:"
          echo "   uses: GigaTech-net/public-reusable-workflows/.github/actions/validate-pr-title@v1"
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    needs: deprecation-notice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR conditions
        id: check_conditions
        run: |
          # shellcheck disable=SC2116,SC2016,SC2086
          {
            check_pr_title=true
            if [[ $PR_TITLE == *"bump"* || "$PR_USER_LOGIN" == "dependabot[bot]" ]]; then
              echo "PR title contains 'bump' or author is dependabot. Skipping issue validation."
              check_pr_title=false
            elif [[ $PR_TITLE == *"hotfix"* ]]; then
              echo "PR title contains 'hotfix'. Skipping issue validation."
              check_pr_title=false
            fi
            echo "check_pr_title=${check_pr_title}" >> $GITHUB_OUTPUT
          }
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}

      - name: validate-pr-title
        uses: ytanikin/PRConventionalCommits@1.3.0
        if: steps.check_conditions.outputs.check_pr_title == 'true'
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          ticket_key_regex: ${{ inputs.ticket_key_regex }}
          add_label: "false"
