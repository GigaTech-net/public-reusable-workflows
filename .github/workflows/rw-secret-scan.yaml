---
name: Secret Scanning

on:
  workflow_call:

permissions: read-all

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-secret-scan.yaml workflow is deprecated."
          echo "🔄 Please use the appropriate composite action instead:"
          echo "   uses: GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1"
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: deprecation-notice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Perform scan to detect leaked credentials & secrets
        uses: GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1
