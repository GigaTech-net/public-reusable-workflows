---
name: Main PR workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

# cancel any previously-started, yet still active runs of this workflow
# on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NEEDS_REVIEW_LABEL: "needs-human-review"
  ARTIFACT_NAME: "vulnerability_rpt"
  RETENTION_DAYS: 1
jobs:
  # Efficient combined job using composite actions for quick checks
  quality-checks:
    runs-on: ubuntu-latest
    outputs:
      current-version: ${{ steps.setup.outputs.current-version }}
      current-v-version: ${{ steps.setup.outputs.current-v-version }}
      version: ${{ steps.setup.outputs.version }}
      v-version: ${{ steps.setup.outputs.v-version }}
      pre-release-label: ${{ steps.setup.outputs.pre-release-label }}
      branch: ${{ steps.setup.outputs.branch }}
      NEEDS_REVIEW_LABEL: ${{ env.NEEDS_REVIEW_LABEL }}
      auto_approve_eligible: ${{ steps.pr-gate.outputs.auto_approve_eligible }}
      gate_reasons: ${{ steps.pr-gate.outputs.reasons }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@v1
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Combined setup, checkout, version detection, and branch extraction
      - name: Setup workflow environment
        id: setup
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/setup-workflow@v1

      # Validate PR title using composite action
      - name: Validate PR title
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/validate-pr-title@v1

      # Secret scan using composite action
      - name: Secret scan
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1

      # Spellcheck using composite action
      - name: Spellcheck
        uses: GigaTech-net/public-reusable-workflows/.github/actions/spellcheck@v1
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          # "iif" appears in templates/super-linter.env as the worked example
          # of Super-Linter's codespell disagreeing with this action. The
          # mirror ships that file, so the repo that documents the conflict
          # must not fail on it.
          wordsToIgnore: "iif"

      # Replaces the `complexity` and `human-review` jobs, which called
      # rw-complexity / rw-checkreview. Those read a single label and
      # approved on sight. As a step inside quality-checks the gate is
      # covered by the one required status check.
      - name: PR gate
        id: pr-gate
        uses: GigaTech-net/public-reusable-workflows/.github/actions/pr-gate@v1
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          needs_review_label: ${{ env.NEEDS_REVIEW_LABEL }}

  # auto-approve BEFORE enable-auto-merge. The reverse order leaves a PR
  # armed-but-unapproved when the approval step fails, so the next approval by any
  # human merges it with the gate never re-evaluated.
  auto-approve:
    name: Auto approve PR
    needs: [quality-checks]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: |
      needs.quality-checks.result == 'success' &&
      needs.quality-checks.outputs.auto_approve_eligible == 'true'
    steps:
      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@v1
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      - name: Approve the PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Must be the App token. secrets.GITHUB_TOKEN would discard the App token
          # setup-token just wrote into $GITHUB_ENV, so the approval would come from
          # github-actions[bot] and would NOT satisfy required_approving_review_count.
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  enable-auto-merge:
    name: Enable Auto Merge
    needs: [quality-checks, auto-approve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      needs.quality-checks.result == 'success' &&
      needs.auto-approve.result == 'success' &&
      needs.quality-checks.outputs.auto_approve_eligible == 'true'
    steps:
      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@v1
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      # One step for every author. The previous steps differed only by dependabot
      # conditions and by reading complexity/human-review outputs; pr-gate handles
      # bots via trusted_bots and its semver policy.
      - name: Enable auto merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The App token, not GT_DEVSECOPS_PAT. A PAT bypasses branch protection;
          # the App cannot, because every ruleset has bypass_actors: [].
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  report-gate:
    name: Report gate decision
    needs: [quality-checks]
    runs-on: ubuntu-latest
    if: always() && needs.quality-checks.outputs.auto_approve_eligible != 'true'
    steps:
      - name: Human review required
        env:
          REASONS: ${{ needs.quality-checks.outputs.gate_reasons }}
        run: |
          echo "This PR is not eligible for automated approval or merge."
          echo "Reasons: $REASONS"
