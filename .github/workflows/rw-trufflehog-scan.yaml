---
name: TruffleHog OSS Scan (deprecated)

on:
  workflow_call:

permissions: read-all

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-trufflehog-scan.yaml workflow is deprecated."
          echo "🔄 Please use the appropriate composite action instead:"
          echo "   uses: GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1"
          echo "   (or trufflehog-scan action, though that is also deprecated)"
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  trufflehog-scan:
    name: TruffleHog Open Source Software (OSS) Scan
    runs-on: ubuntu-latest
    needs: deprecation-notice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm correct branch to scan
        run: echo "Preparing to scan branch ${GITHUB_REF_NAME}"

      - name: Perform TruffleHog scan to detect leaked credentials & secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --json --only-verified
