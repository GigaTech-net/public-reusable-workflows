---
name: Spellcheck (deprecated)

on:
  workflow_call:
    inputs:
      wordsToIgnore:
        required: false
        type: string
        description: "Comma separated words to ignore spellchecking"
      filesToIgnore:
        required: false
        type: string
        description: "Comma separated file names to ignore spellchecking"

permissions:
  contents: write

jobs:
  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a pull_request, GITHUB_REF is refs/pull/<n>/merge, which cannot be
      # pushed to -- so report only. See .github/actions/spellcheck.
      - name: Determine whether corrections can be written back
        id: extract_branch
        run: |
          # shellcheck disable=SC2086
          {
            if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
              echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
              echo "write_changes=--write-changes" >> $GITHUB_OUTPUT
            else
              echo "not on a branch (${GITHUB_REF}) - reporting only"
              echo "branch=" >> $GITHUB_OUTPUT
              echo "write_changes=" >> $GITHUB_OUTPUT
            fi
          }

      - name: Install codespell
        run: pip install codespell

      # Keep the dictionary out of the checkout. See .github/actions/spellcheck.
      - name: Unpack and use codespell autocorrect dictionary
        run: |
          wget -q -O "${RUNNER_TEMP}/dictionary.txt" \
            https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary.txt

      - name: Run spellcheck
        env:
          FILES_TO_IGNORE: ${{ inputs.filesToIgnore }}
          WORDS_TO_IGNORE: ${{ inputs.wordsToIgnore }}
          WRITE_CHANGES: ${{ steps.extract_branch.outputs.write_changes }}
        run: |
          # shellcheck disable=SC2086
          {
            codespell \
              -D "${RUNNER_TEMP}/dictionary.txt" \
              --count \
              --quiet-level 2 \
              --skip "./output,./input-cache,./temp,./template,./fsh-generated,./dictionary.txt,$FILES_TO_IGNORE" \
              -L "ehr,requestor,promis,loinc,recengine,sdvosb,$WORDS_TO_IGNORE" \
              $WRITE_CHANGES
          }

      - name: Commit changes
        if: steps.extract_branch.outputs.branch != ''
        env:
          BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            # -u stages tracked files only; core.fileMode=false stops runner
            # permission-bit differences being mistaken for corrections.
            git config core.fileMode false
            git add -u
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
            else
              git commit -m "fix: automatic spelling correction on branch $BRANCH_NAME"
              git push origin "HEAD:refs/heads/$BRANCH_NAME"
            fi
          }
