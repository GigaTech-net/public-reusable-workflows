---
name: Workflow Setup
# SUPERSEDED by the pr-gate composite action
# (.github/actions/pr-gate). This workflow remains functional for
# consumers that have not yet migrated, but its decision logic has
# known gaps documented in the README under 'The PR gate'. New
# consumers should not adopt it.

on:
  workflow_call:
    inputs:
      needsReviewLabel:
        required: false
        type: string
        description: "the label to signify that a manual review is required"
        default: "needs-human-review"
    outputs:
      human_review_needed:
        description: "true if a human review is needed, false otherwise"
        value: ${{ jobs.setup.outputs.human_review_needed }}

permissions: read-all

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-checkreview.yaml workflow is deprecated."
          echo "🔄 This workflow remains functional but is deprecated."
          echo "   Future updates will focus on composite actions where applicable."
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  setup:
    name: Setup
    runs-on: ubuntu-latest
    needs: deprecation-notice
    outputs:
      human_review_needed: ${{ steps.check_hrn_label.outputs.human_review_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check if needs review label is set
        id: check_hrn_label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_REVIEW_LABEL: ${{ inputs.needsReviewLabel }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # shellcheck disable=SC2086
          {
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "This action is not being run in a pull request event, the needsReviewLabel is not applicable."
              exit 0
            fi

            LABELS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/labels" | jq -r '.[].name')

            NEEDS_REVIEW=false
            if echo "$LABELS" | grep -q "$NEEDS_REVIEW_LABEL"; then
              NEEDS_REVIEW=true
            else
              NEEDS_REVIEW=false
            fi

            {
              echo 'labels<<EOF'
              echo $LABELS
              echo EOF 
            } >> $GITHUB_OUTPUT
            echo "human_review_needed=$NEEDS_REVIEW" >> $GITHUB_OUTPUT

            echo "*************DEBUG START *************"
            echo "Labels:"
            echo "$LABELS"
            echo "---"
            echo "needs human review => $NEEDS_REVIEW"
            echo "*************DEBUG END   *************"
          }
