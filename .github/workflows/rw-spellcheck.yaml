---
name: Spellcheck

on:
  workflow_call:
    inputs:
      wordsToIgnore:
        required: false
        type: string
        description: "Comma separated words to ignore spellchecking"
      filesToIgnore:
        required: false
        type: string
        description: "Comma separated file names to ignore spellchecking"

permissions:
  contents: write

jobs:
  deprecation-notice:
    name: Deprecation Notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Display Deprecation Warning
        run: |
          echo "⚠️  DEPRECATION NOTICE: This rw-spellcheck.yaml workflow is deprecated."
          echo "🔄 Please use the appropriate composite action instead:"
          echo "   uses: GigaTech-net/public-reusable-workflows/.github/actions/spellcheck@v1"
          echo ""
          echo "For more information, see: https://github.com/GigaTech-net/public-reusable-workflows#composite-actions"

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deprecation-notice
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a pull_request, GITHUB_REF is refs/pull/<n>/merge, which cannot be
      # pushed to -- so report only. See .github/actions/spellcheck.
      - name: Determine whether corrections can be written back
        id: extract_branch
        run: |
          # shellcheck disable=SC2086
          {
            if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
              echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
              echo "write_changes=--write-changes" >> $GITHUB_OUTPUT
            else
              echo "not on a branch (${GITHUB_REF}) - reporting only"
              echo "branch=" >> $GITHUB_OUTPUT
              echo "write_changes=" >> $GITHUB_OUTPUT
            fi
          }

      # Keep the venv and the dictionary out of the checkout -- some repos track
      # a `venv/` directory, and creating one in the working tree rewrites those
      # tracked files. See .github/actions/spellcheck.
      - name: Install codespell
        run: |
          {
            python3 -m venv "${RUNNER_TEMP}/codespell-venv"
            # shellcheck disable=SC1091
            source "${RUNNER_TEMP}/codespell-venv/bin/activate"
            pip install codespell
          }

      - name: Unpack and use codespell autocorrect dictionary
        run: |
          wget -q -O "${RUNNER_TEMP}/dictionary.txt" \
            https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary.txt

      - name: Run spellcheck
        env:
          FILES_TO_IGNORE: ${{ inputs.filesToIgnore }}
          WORDS_TO_IGNORE: ${{ inputs.wordsToIgnore }}
          WRITE_CHANGES: ${{ steps.extract_branch.outputs.write_changes }}
        run: |
          # shellcheck disable=SC1091,SC2086
          {
            source "${RUNNER_TEMP}/codespell-venv/bin/activate"
            codespell \
              -D "${RUNNER_TEMP}/dictionary.txt" \
              --count \
              --quiet-level 2 \
              --skip "./output,./input-cache,./temp,./template,./fsh-generated,./dictionary.txt,.gitignore,./src,./venv,.dockerignore,Dockerfile,package.json,package-lock.json,$FILES_TO_IGNORE" \
              -L "ehr,requestor,promis,loinc,recengine,sdvosb,$WORDS_TO_IGNORE" \
              $WRITE_CHANGES
          }

      - name: Commit changes
        if: steps.extract_branch.outputs.branch != ''
        env:
          BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            # -u stages tracked files only; core.fileMode=false stops runner
            # permission-bit differences being mistaken for corrections.
            git config core.fileMode false
            git add -u
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
            else
              git commit -m "fix: automatic spelling correction on branch $BRANCH_NAME"
              git push origin "HEAD:refs/heads/$BRANCH_NAME"
            fi
          }
