---
name: Create Pull Request (DEPRECATED)

# ⚠️  DEPRECATION NOTICE ⚠️
# This reusable workflow is DEPRECATED and will be removed in a future version.
# Please migrate to the new composite action: ./.github/actions/create-pr
#
# Migration Guide:
# OLD: uses: ./.github/workflows/rw-create-pr.yaml
# NEW: uses: ./.github/actions/create-pr
#
# See: ./.github/actions/create-pr/README.md for full documentation

on:
  workflow_call:
    inputs:
      head-branch:
        required: false
        type: string
        default: "development"
        description: "the name of the branch to merge into the base branch"
      base-branch:
        required: false
        type: string
        default: "main"
        description: "the name of the branch to merge into"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes between branches
        id: check_changes
        run: |
          # shellcheck disable=SC2116,SC2016,SC2086
          {
            changes_detected=true
            git fetch origin ${BASE_BRANCH}:${BASE_BRANCH}
            if git diff --quiet ${BASE_BRANCH}...${HEAD_BRANCH}; then
              echo "No changes detected between ${HEAD_BRANCH} and ${BASE_BRANCH}."
              changes_detected=false
            else
              echo "Changes detected between ${HEAD_BRANCH} and ${BASE_BRANCH}."
              changes_detected=true
            fi
              echo "changes_detected=${changes_detected}" >> $GITHUB_OUTPUT
          }
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          HEAD_BRANCH: ${{ inputs.head-branch }}

      - name: Check for Existing Open PRs
        id: check_existing_prs
        env:
          GITHUB_TOKEN: ${{ secrets.GT_DEVSECOPS_PAT }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
        run: |
          # shellcheck disable=SC2116,SC2016,SC2086
          {
            open_pr=false
            if gh pr list --state open --base ${BASE_BRANCH} --head ${HEAD_BRANCH} | grep -q .; then
              echo "Open PR already exists bewteen ${HEAD_BRANCH} and ${BASE_BRANCH}."
              open_pr=true
            else
              echo "No open PR exists between ${HEAD_BRANCH} and ${BASE_BRANCH}."
              open_pr=false
            fi
            echo "open_pr=${open_pr}" >> $GITHUB_OUTPUT
          }

      - name: Deprecation Warning
        run: |
          echo "::warning::This reusable workflow is DEPRECATED!"
          echo "::warning::Please migrate to the new composite action: ./.github/actions/create-pr"
          echo "::warning::See ./.github/actions/create-pr/README.md for migration guide"
          echo "::warning::This workflow will be removed in a future version"

      - name: Create PR (Legacy)
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.check_existing_prs.outputs.open_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GT_DEVSECOPS_PAT }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
        run: |
          echo -e "⚠️ **DEPRECATION NOTICE** ⚠️\n\nThis PR was created using the DEPRECATED rw-create-pr.yaml workflow.\nPlease migrate to the new composite action: ./.github/actions/create-pr\n\n---\n\nThis pull request may merge: \n- Latest Dependencies\n- Bug Fixes\n- New Features" | gh pr create --base "${BASE_BRANCH}" --head "${HEAD_BRANCH}" --title "feat: hotfix : merge to bring ${BASE_BRANCH} up to date with ${HEAD_BRANCH}" --body-file -
