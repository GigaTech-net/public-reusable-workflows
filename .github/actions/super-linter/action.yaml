---
name: Super Linter
description: |
  Composite action that runs GitHub Super Linter with environment file support.
  Loads configuration from .github/super-linter.env if it exists and runs the Super Linter.
  Skips the Super Linter step, and its image pull, when no changed file is in a
  language the configuration enables and no lint configuration changed. That
  can happen only when the configuration lists linters with
  VALIDATE_<LANGUAGE>=true and sets no VALIDATE_<LANGUAGE>=false, whatever
  VALIDATE_ALL_CODEBASE is; every other configuration, and any change set that
  cannot be determined, runs Super Linter. Needs a checkout with full history
  (actions/checkout fetch-depth: 0) for the gate to skip; without it the gate
  runs the linter.

inputs:
  github_token:
    description: "GitHub token for authentication"
    required: false
    default: ${{ github.token }}
  env_file_path:
    description: "Path to the Super Linter environment file"
    required: false
    default: ".github/super-linter.env"
  run_local:
    description: "Override RUN_LOCAL setting"
    required: false
    default: "false"
  language_gate:
    description: |
      'true' skips Super Linter when no changed file is in an enabled language
      (see the description above). Any other value always runs it.
    required: false
    default: "true"

outputs:
  ran:
    description: "'false' when the language gate skipped Super Linter; 'true' otherwise"
    value: ${{ steps.gate.outputs.run }}
  gate_reason:
    description: "One line explaining the gate's decision"
    value: ${{ steps.gate.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Load Super Linter environment file
      shell: bash
      # Through `env`, not `${{ }}` in the body: a caller-supplied path was being
      # pasted into the command. Consumers now pass a second file here
      # (.github/super-linter-push.env) for push and release builds, so this
      # input is no longer effectively constant.
      env:
        ENV_FILE_PATH: ${{ inputs.env_file_path }}
      run: |
        ENV_FILE="$ENV_FILE_PATH"
        if [[ -f "$ENV_FILE" ]]; then
          echo "Loading environment variables from $ENV_FILE"
          # Read the env file and export variables to GITHUB_ENV
          while IFS= read -r line || [[ -n "$line" ]]; do
            # Skip empty lines and comments
            if [[ -n "$line" && ! "$line" =~ ^[[:space:]]*# ]]; then
              # Remove any trailing whitespace and export to GITHUB_ENV
              echo "$line" >> $GITHUB_ENV
              echo "Loaded: $line"
            fi
          done < "$ENV_FILE"
        else
          echo "Environment file $ENV_FILE not found, using defaults"
        fi

    # Reads the VALIDATE_* values the step above loaded, which are the values
    # Super Linter itself will see, and fails open to running it.
    - name: Decide whether Super Linter has anything to lint
      id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The PR head, not github.sha: on pull_request github.sha is the
        # synthetic merge commit.
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Not DEFAULT_BRANCH: the env file may set that for Super Linter, and a
        # step-level value would override the one GITHUB_ENV carries here.
        REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LANGUAGE_GATE: ${{ inputs.language_gate }}
        # Changing the env file in use is a lint-configuration change.
        ENV_FILE_PATH: ${{ inputs.env_file_path }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/language-gate.sh"

    # docker run, not `uses: super-linter/super-linter/slim@...`: the runner
    # pre-pulls the image of every Docker container action nested in a composite
    # action during job setup, whatever `if:` says, so a skipped step still paid
    # the ~1 GB pull. See run-super-linter.sh.
    - name: Run Super Linter
      if: steps.gate.outputs.run != 'false'
      shell: bash
      run: bash "${ACTION_PATH}/run-super-linter.sh"
      env:
        ACTION_PATH: ${{ github.action_path }}
        # The one place the Super Linter version is pinned. Dependabot does not
        # see an image named in a script, so a bump is this line, by hand.
        SUPER_LINTER_IMAGE: ghcr.io/super-linter/super-linter:slim-v9.0.0
        GITHUB_TOKEN: ${{ inputs.github_token }}
        RUN_LOCAL: ${{ inputs.run_local }}
        # Keep mypy's cache out of the scanned tree.
        #
        # Super-Linter's mypy pass writes `.mypy_cache` into the workspace and
        # leaves `missing_stubs` there as a symlink with no target. Its Trivy
        # pass runs afterwards, walks the workspace, calls lstat on that
        # symlink and exits FATAL:
        #
        #   walk dir error: unknown error with /github/workspace/.mypy_cache/
        #   missing_stubs: file info error: lstat ...: no such file or directory
        #
        # The whole lint fails, and it fails for every consumer whose Super-
        # Linter run touches Python. It hides on a pull request, which lints
        # changed files alone, and appears on a push to a branch that lints
        # everything — so it looks like it belongs to whichever change happens
        # to land. It took `manage-github-org`'s org-reconcile job down that
        # way.
        #
        # Relocating the cache rather than teaching Trivy to skip it: this
        # removes the artifact from the tree being scanned, needs no Trivy
        # configuration, and cannot collide with a consumer's own
        # `scan.skip-dirs`. mypy honours MYPY_CACHE_DIR, and Super-Linter's
        # bundled mypy config sets no `cache_dir` to override it.
        MYPY_CACHE_DIR: /tmp/mypy-cache
