name: "Dependency Check"
description: "Performs OWASP dependency vulnerability scanning and uploads results as artifacts"
author: "GigaTech"

inputs:
  artifact_name:
    description: "The artifact name to write to GitHub blob storage after this action completes"
    required: false
    default: "vulnerability_rpt"
  retention_days:
    description: "The number of days to retain the artifact in GitHub blob storage after this action completes"
    required: false
    default: "1"
  working_directory:
    description: "Working directory for the action"
    required: false
    default: "."
  oss_index_user:
    description: "OSS Index user"
    required: true
  oss_index_api_token:
    description: "OSS Index API token"
    required: true

outputs:
  artifact_name:
    description: "The name of the uploaded artifact"
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    - name: Run dependency check
      id: dependency-check
      continue-on-error: true
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: ${{ github.repository }}
        path: ${{ inputs.working_directory }}
        format: "ALL"
        out: "reports"
        args: >
          --enableRetired
          --prettyPrint
          --ossIndexUsername ${{ inputs.oss_index_user }}
          --ossIndexPassword ${{ inputs.oss_index_api_token }}

    - name: Validate dependency check results
      id: validate
      shell: bash
      run: |
        if [ "${{ steps.dependency-check.outcome }}" = "success" ]; then
          echo "Dependency check completed successfully."
          exit 0
        fi

        # Step failed — check if reports were still produced by other analyzers
        REPORT_DIR="${{ github.workspace }}/reports"
        if [ -d "$REPORT_DIR" ] && [ "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
          echo "::warning::Dependency check encountered errors (e.g. NPM Audit API unavailable) but reports were produced by other analyzers. Continuing with partial results."
          ls -la "$REPORT_DIR"
          exit 0
        fi

        echo "::error::Dependency check failed and produced no reports. The scan did not complete."
        exit 1

    - name: Upload dependency check results as artifact
      if: always()
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}-${{ github.sha }}
        path: ${{ github.workspace }}/reports
        retention-days: ${{ inputs.retention_days }}
