---
name: Secret Scan
description: |
  Scans the commits the triggering event introduced for leaked credentials with
  TruffleHog, and fails when it finds a secret, reports an error, or inspects
  nothing. See README.md for the base/head contract per event.

inputs:
  path:
    description: "Repository path to scan"
    required: false
    default: "./"
  base:
    description: "Commit to scan from (exclusive). Empty: derived from the event"
    required: false
    default: ""
  head:
    description: "Commit to scan to (inclusive). Empty: derived from the event"
    required: false
    default: ""
  extra_args:
    description: "Extra arguments to pass to TruffleHog"
    required: false
    default: "--debug --json --only-verified"
  version:
    description: "TruffleHog image tag"
    required: false
    default: "latest"
  image:
    description: "TruffleHog image, without tag"
    required: false
    default: "ghcr.io/trufflesecurity/trufflehog"

runs:
  using: composite
  steps:
    - name: Scan the event's commit range for secrets
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_IMAGE: ${{ inputs.image }}
        SCRIPT: ${{ github.action_path }}/secret-scan.sh
      run: bash "$SCRIPT"
